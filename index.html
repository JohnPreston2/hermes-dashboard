  h+=`<div class="sec"><h2>La boucle de recherche</h2>
      <p>six stations autour d'un état partagé — les nombres viennent du flux, la forme vient du code</p></div>
    <div class="card rv"><div class="bd">${dgmLoop(D)}
      <p class="dgm-note">Le cycle se lit dans le sens horaire ; les traits pointillés sont les
      <b>écritures au corpus</b> — c'est par elles qu'un passage laisse une trace, et non par le brief publié.
      Une seule station est accentuée : <b>le verdict</b>, parce que c'est la seule sortie du système
      qui puisse être fausse de façon vérifiable.</p></div></div>`;

  h+=`<div class="sec"><h2>Le mur des veilles</h2><p>une tuile = un prédicat falsifiable · ${S?S.evaluable+" évaluables":""}</p></div>
    <div class="card rv">${head("État de la boucle de vérification",B.watches,
      S?`<span class="chip">${S.total} émis</span><span class="chip">${S.rejected} rejetés au canon</span>`:"")}
      ${guard(B.watches,W=>`<div class="wall" role="img" aria-label="Mur des veilles : ${W.stats.by_verdict.BROKEN||0} prédicats falsifiés, ${W.stats.by_verdict.HELD||0} tenus, ${W.stats.by_verdict.OPEN||0} encore ouverts sur ${W.stats.evaluable} évaluables. Le détail de chaque prédicat est dans la vue Veilles.">${(W.items||[]).map(w=>
        `<b data-v="${esc(w.verdict||"OPEN")}" aria-hidden="true" title="${esc((w.verdict||"")+" · "+(w.metric||"")+" "+(w.entity||"")+" · échéance "+(w.deadline||"?"))}"></b>`).join("")}</div>
      <div class="wall-key">

        <span><i style="background:color-mix(in oklch,var(--open) 62%,var(--s1))"></i>${W.stats.by_verdict.OPEN||0} ouverts</span>
        <span><i style="background:var(--line2)"></i>${W.stats.by_verdict.UNEVALUABLE||0} non évaluables</span>
      </div>`,"veilles")}
    </div>`;

  h+=`<div class="sec"><h2>Qui a raison</h2><p>taux de prédicats tenus, par producteur — seul le verdict échu compte</p></div>
    <div class="card rv">${head("Scoreboard L3 · L4",B.watches)}
      ${guard(B.watches,W=>{
        const S=W.stats,rows=[["L3","brief scripté GLM"],["L4","brain autonome"]];
        return '<div class="score">'+rows.map(([k,sub])=>{
          const r=S.by_src[k]||{held:0,broken:0,open:0,rate:null},tot=r.held+r.broken+r.open||1;
          return `<div class="srow"><span class="who">${k}<small>${esc(sub)}</small></span>
            <span class="track" role="img" aria-label="${r.held} tenus, ${r.broken} falsifiés, ${r.open} ouverts">

            <span class="rate" style="color:${has(r.rate)?(r.rate>=50?"var(--held)":"var(--broken)"):"var(--ink4)"}">

          // ── la ligne d'horizon ────────────────────────────────────────────

          // (data/benchmarks.json) : absent ou périmé, on n'affiche rien plutôt
          // qu'un repère dont on ignore l'âge.
          (()=>{const bm=S.benchmark;if(!bm||!bm.bars)return "";
            const mx=Math.max(50,...bm.bars.map(b=>b.rate_pct||0));
            return `<div style="border-top:1px dashed var(--line);margin-top:6px;padding-top:12px">

                <span style="font:600 11px var(--mono);color:var(--ink3);letter-spacing:.04em">${esc(b.label)}
                  <small style="display:block;font-weight:500;font-size:9.5px;color:var(--ink4)">${esc(b.role||"")} · ${b.held}/${b.n}</small></span>
                <span style="height:9px;border-radius:6px;border:1px dashed var(--line);overflow:hidden;display:flex" role="img"
                  aria-label="${esc(b.label)} : ${nf(b.rate_pct,1)} pour cent de prédicats tenus, ${b.held} sur ${b.n}">
                  <i style="display:block;height:100%;width:${Math.min(100,(b.rate_pct/mx)*100)}%;background:${b.key==="rule"?"var(--warn)":"var(--ink4)"};opacity:.72"></i></span>
                <span style="font-family:var(--serif);font-size:18px;font-weight:600;text-align:right;color:${b.key==="rule"?"var(--warn)":"var(--ink4)"}">${nf(b.rate_pct,1)}%</span></div>`).join("")}
            </div>`;})()+
          `</div>`+(()=>{const bm=S.benchmark;

            ${bm?`<br><br><b style="color:var(--warn)">La question n'est pas « le taux est-il bon », c'est « bat-on l'étalon ».</b>
              ${esc((bm.bars.find(b=>b.key==="rule")||{}).detail||"")} — ${esc(bm.method||"")},
              ${bm.bars.map(b=>`${esc(b.label)} ${nf(b.rate_pct,1)} % (${b.held}/${b.n})`).join(" · ")}${has(bm.fisher_p)?`, Fisher p = ${nf(bm.fisher_p,3)}`:""}.
              ${bm.age_days!=null?`Mesure vieille de ${Math.round(bm.age_days)} jours.`:""}
              ${S.scale_odd?`<br><br><b style="color:var(--warn)">Réserve sur le taux mesuré :</b> ${S.scale_odd} verdict${S.scale_odd>1?"s":""} rendu${S.scale_odd>1?"s":""}

                ${S.scale_odd>1?"ils tombent":"il tombe"} BROKEN mécaniquement et tire${S.scale_odd>1?"nt":""} le taux vers le bas. Repérés dans le journal, jamais reclassés.`:""}
              <br><b>${esc(bm.warning||"")}</b>`
             :`<br><br>Aucune ligne d'horizon disponible : <code>data/benchmarks.json</code> est absent ou illisible.`}</div>`;})();
      },"veilles")}
    </div>`;

  // ── LE DÉCHET À L'ÉMISSION ────────────────────────────────────────────
  // Le taux de veilles tenues se calcule sur ce qui SURVIT. Sans le taux de déchet,
  // on compare des producteurs sur la partie de leur production qui a passé le filtre,

  h+=`<div class="sec"><h2>Le déchet à l'émission</h2>

    '<span class="chip t">machine à états</span>')}

      <p class="dgm-note">Les cinq états sont ceux du code, pas une illustration : <code>watch_executor</code>
      canonise l'entité (un agrégat ou un secteur est <b>rejeté avant toute mesure</b>), puis tranche à

  <div class="card rv" style="margin-bottom:14px">${head("Répartition",B.watches)}
    ${guard(B.watches,W=>{const S=W.stats;return `<div class="bd">

          `<div class="kpi"${k[2]?` data-tone="${k[2]}"`:""}><div class="l">${k[0]}</div><div class="v">${k[1]}</div><span class="bar"></span></div>`).join("")}

             "first_seen = date de CANONISATION par watch_executor (00h45 · 06h45 · 13h45). Une veille écrite dans un brief de 18 h n'entre au registre que le lendemain : jusqu'à 6 h 30 de décalage, structurel."],
           ["Tranchées aujourd'hui",S.decided_today,"l'exécuteur a rendu son verdict",

/* ── LE JOURNAL DES VERDICTS ───────────────────────────────────────────────
   Le mur montre les PARIS ; il ne montrait pas la CHRONOLOGIE des décisions.
   Or l'exécuteur tranche tous les jours — 20 verdicts le jour de l'audit — et
   c'est la seule preuve quotidienne que la boucle de vérification tourne.
   Aucune donnée nouvelle : `decided` et `current` sont déjà dans le flux.     */
function measured(w){
  if(w.op==="delta_pct")
    return has(w.observed_pct)?`mesuré <b>${w.observed_pct>0?"+":""}${nf(w.observed_pct,2)} %</b>`:null;
  if(!has(w.current))return null;
  const m=String(w.metric||"").toLowerCase();
  const v=(m==="funding")?nf(w.current,4)+" %":(usd(w.current)||nf(w.current,2));
  return `mesuré <b>${v}</b>`;
}
function journal(bk){
  if(!bk||bk.err||!bk.v)return "";
  const items=(bk.v.items||[]).filter(w=>w.decided);
  if(!items.length)return "";
  const byDay={};
  items.forEach(w=>{(byDay[w.decided.slice(0,10)]=byDay[w.decided.slice(0,10)]||[]).push(w);});
  const days=Object.keys(byDay).sort().reverse().slice(0,3);
  if(!days.length)return "";
  const today=new Date().toISOString().slice(0,10);
  // Si le jour le plus récent n'est PAS aujourd'hui, l'absence de carte « Aujourd'hui »
  // est un signal trop discret : on l'écrit. Un exécuteur arrêté ne doit pas ressembler
  // à un exécuteur qui n'avait rien à trancher.
  const retard=days[0]!==today
    ? Math.round((Date.parse(today+"T00:00:00Z")-Date.parse(days[0]+"T00:00:00Z"))/86400000):0;
  return `<div class="sec"><h2>Le journal des verdicts</h2>
      <p>ce que la mesure a tranché — la boucle de vérification, jour par jour</p>
      ${retard?`<span class="chip warn" style="margin-left:auto">aucun verdict depuis ${retard} j</span>`:""}</div>
    ${retard>1?`<div class="card" style="margin-bottom:14px"><div class="missing"><b>l'exécuteur n'a rien tranché depuis ${retard} jours</b>
      dernier verdict rendu le ${jour(days[0])}
      <div class="note">Le registre compte pourtant des échéances passées : soit <code>watch_executor</code> ne tourne plus, soit il ne trouve plus de mesure. À vérifier avant de lire les taux ci-dessous.</div></div></div>`:""}
    <div class="grid g-2">${days.map((d,i)=>{
      const ws=byDay[d].slice().sort((a,b)=>b.decided.localeCompare(a.decided));
      const held=ws.filter(w=>w.verdict==="HELD").length,brk=ws.filter(w=>w.verdict==="BROKEN").length;
      return `<div class="card rv">${head(d===today?"Aujourd'hui":stamp(d+"T12:00:00Z").slice(0,5),null,
        `<span class="chip good">${held} tenu${held>1?"s":""}</span><span class="chip bad">${brk} falsifié${brk>1?"s":""}</span>
         <span class="chip">${ws.length} verdict${ws.length>1?"s":""}</span>`)}
        <div class="bd" style="display:grid;gap:10px">${ws.slice(0,12).map(w=>`
          <div data-s="${esc((w.entity||"")+" "+(w.metric||""))}" style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start">
            <span class="vpill" data-v="${esc(w.verdict)}" style="margin-top:2px">${esc(w.verdict)}</span>
            <div style="min-width:0">
              <div class="pred" style="font-family:var(--mono);font-size:11.5px;color:var(--ink)">${predicate(w)}</div>
              <div style="font:11px var(--mono);color:var(--ink4);margin-top:3px">
                ${measured(w)||'<span class="na">valeur non transportée</span>'} ·
                <span title="entrée au registre (canonisation par watch_executor à 00h45 · 06h45 · 13h45), pas la rédaction du brief">au registre ${ago(w.seen)||"?"}</span> ·
                <span class="srcpill" data-s="${esc(w.src||"")}">${esc(w.src||"?")}</span>
                ${w.scale_odd?'<span class="chip warn" style="margin-left:6px" title="le seuil et la mesure ne sont pas dans la même unité : ce prédicat ne pouvait pas tenir. Le verdict affiché reste celui de l\'exécuteur.">hors échelle</span>':""}</div>
            </div></div>`).join("")}
          ${ws.length>12?`<div class="note">et ${ws.length-12} autres — le détail complet est dans le registre ci-dessous.</div>`:""}
        </div></div>`;}).join("")}
    </div>
    <div class="card" style="margin-top:14px"><div class="note" style="padding:11px 14px">
      Un verdict est rendu par <code>watch_executor</code> à l'échéance du prédicat, sur la mesure du jour — jamais par un modèle.
      C'est la seule sortie du système qui puisse avoir <b>tort de façon vérifiable</b>.</div></div>`;
}

V.theses=(D)=>`<div class="sec"><h2>Le livre de thèses</h2><p>append-only · la conviction est une trajectoire, pas une photo</p></div>

    const ts=T.items||[],wb=T.writeback||{},dn=T.n_dormant||0,dd=T.dormant_days||7;
    // Le bilan d'écriture : le brain émet des verdicts que le ledger accepte ou REJETTE.
    // Sans ce bandeau, « le livre ne bouge plus » est indiscernable de « l'agent n'a plus
    // rien à dire ». Les deux se soignent à des endroits opposés.
    const tiers=Object.entries(wb.by_tier||{}).sort((a,b)=>b[1].emitted-a[1].emitted);

          <tbody>${tiers.map(([k,v])=>`<tr><td class="k"><span class="tier" data-t="${esc(k)}">${esc(k)}</span></td>

          // Nommer le refus. Un compteur dit « quelque chose est refusé » ; l'identifiant

          return `<div style="margin-top:14px">
            <div style="font:10.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-bottom:9px">
              Identifiants refusés par le registre${wb.ids_since?` · relevés depuis le ${stamp(wb.ids_since)}`:""}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">${ids.map(r=>

            <div class="note" style="margin-top:11px">Ces chaînes ne correspondent à aucune thèse du livre de recherche : le résolveur attend
            un identifiant de cliché (<code>th_AAAAMMJJ_HHMM_entité</code>) ou une entité <b>nue</b>. Un slug descriptif tombe entre les deux
            et le verdict est jeté, silencieusement, depuis toujours.</div></div>`;})()}
      </div></div>

    ${(()=>{const U=T.universe;
      if(!U||!U.entities||!U.entities.length)
        return U&&U.err?`<div class="card rv" style="margin-bottom:14px"><div class="missing"><b>vivier illisible</b>${esc(U.err)}</div></div>`:"";
      // LE VIVIER — deuxième moitié du diagnostic. Une thèse ne peut bouger que si

        </div></div>`;})()}

    <div class="card rv">${head("thesis_verdicts.jsonl",D.blocks.theses,
      dn?`<span class="chip warn">${dn} dormante${dn>1?"s":""}</span>`:"")}
      ${ts.length?`<div class="tw"><table>
      <thead><tr><th>Thèse</th><th>Verdict</th><th class="r">Conviction</th><th>Trajectoire</th>

        <td class="k">${esc(t.key)}${t.dormant?'<span class="chip warn" style="margin-left:7px">dormante</span>':""}</td>
        <td><span class="vtag ${esc(t.verdict||"")}">${esc(t.verdict||"?")}</span></td>
        <td class="r">${has(t.conviction)?nf(t.conviction,2):NA}</td>
        <td>${spark((t.history||[]).map(h=>h.c),110,28,t.verdict==="retire"?"var(--ink4)":t.dormant?"var(--ink3)":"var(--held)")}</td>
        <td style="color:var(--ink3);font-size:11.5px;max-width:300px">${esc(t.trigger||"")||NA}</td>
        <td style="color:var(--ink2);font-size:11.5px;max-width:280px">${t.kill?"⚑ "+esc(t.kill):NA}</td>
        <td class="r" style="color:${t.dormant?"var(--warn)":"var(--ink4)"}">${ago(t.ts)||"?"}</td></tr>`).join("")}</tbody></table></div>
      <div class="note" style="padding:11px 14px"><b>Dormante</b> = aucun verdict depuis ${dd} jours : la ligne est de l'histoire, pas une lecture d'aujourd'hui.
      Un CONFIRM sans conviction hérite de la précédente (carry-forward). Un RETIRE éteint la thèse — l'historique reste.
      Les conditions d'invalidation proviennent du livre de recherche et sont appariées par entité : toutes les thèses n'en ont pas.</div>`
      :'<div class="empty">aucune thèse</div>'}</div>`;},"thèses")}`;

V.enquetes=(D)=>{
  const qs0=(D.blocks.inquiries&&D.blocks.inquiries.v)||[];
  const nd=qs0.filter(q=>q.dormant).length;
  return `<div class="sec"><h2>Enquêtes-mission</h2><p>la mission permanente · chaque note est datée, la trajectoire se lit de haut en bas</p>
    ${nd?`<span class="chip warn" style="margin-left:auto">${nd} dormante${nd>1?"s":""} sur ${qs0.length}</span>`:""}</div>
  ${guard(D.blocks.reflex,r=>`<div class="card rv" style="margin-bottom:16px">
    ${head("Réflexif — synthèse hebdomadaire",D.blocks.reflex,
      `<span class="chip">${r.n} question${r.n>1?"s":""} · ${esc(r.date)}</span>`)}
    <div class="bd">${(r.syntheses||[]).map(s=>`
      <details class="dossier"><summary>${esc((s.question||s.id||"").slice(0,96))}
        <span class="chip" style="margin-left:auto">${s.n_obs} obs · ${s.n_dates} dates · ${nf(s.couverture,0)} %</span></summary>
        <div class="tx open" style="padding:0 11px 12px">${md(s.prose)}</div>
        ${(s.flags||[]).length?`<div class="note" style="color:var(--warn);padding:0 11px 10px">⚠ ${esc(s.flags.join(" · "))}</div>`:""}
      </details>`).join("")}
      <div class="note">Prose libre, sans gabarit — le code n'en extrait que la traçabilité.
        Un job d'interprétation dont on contraint le format rend un formulaire vide.</div></div></div>`,"reflex")}
  <div class="grid g-2" id="ilist">${guard(D.blocks.inquiries,qs=>qs.map(q=>`
    <div class="card rv"${q.dormant?' data-dormant="1"':""} data-s="${esc(q.q+" "+(q.evidence||[]).map(e=>e.note).join(" "))}">
      ${head(esc(q.q),null,`<span class="chip ${q.status==="permanent"?"acc":"info"}">${esc(q.status)}</span>
        ${has(q.touches)?`<span class="chip" title="nombre de fois où un run a touché cette enquête">${q.touches} touches</span>`:""}
        ${q.last_touched?`<span class="chip ${q.dormant?"warn":""}" title="dernier passage d'un run sur cette enquête — ${stamp(q.last_touched)}">${q.dormant?"dormante · ":""}${ago(q.last_touched)}</span>`:'<span class="chip warn">jamais touchée</span>'}`)}
      <div class="bd">
        ${(q.evidence||[]).length?`<div style="display:grid;gap:9px">${q.evidence.slice().reverse().map(e=>`
          <div style="display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline">
            <span style="font:10.5px var(--mono);color:var(--ink4);white-space:nowrap">${e.ts?stamp(e.ts):"—"}</span>
            <span style="font-size:12px;color:var(--ink2);text-wrap:pretty">${esc(e.note)}</span></div>`).join("")}</div>`
          :`<div class="empty">aucune note d'enquête${has(q.age_d)?" — ouverte il y a "+Math.round(q.age_d)+" jours, jamais travaillée depuis":""}</div>`}
        ${q.next_probe?`<div class="note" style="border-top:1px solid var(--line);padding-top:9px;margin-top:11px">
          <b style="color:var(--acc);font-family:var(--mono);font-size:10px;letter-spacing:.11em">PROCHAINE SONDE</b><br>${esc(q.next_probe)}</div>`:""}
      </div></div>`).join(""),"enquêtes")}</div>
  <div class="card"><div class="note" style="padding:11px 14px">Toutes les enquêtes du registre sont affichées, sans coupe.
  Une enquête <b>dormante</b> n'a reçu aucune note depuis 7 jours : elle est ouverte dans le fichier, pas dans le travail de l'agent.</div></div>`;
};

V.marche=(D)=>{
  const B=D.blocks;
  /* --- à la une (dashboard 2026-09-03) : sélection du curateur, sessions,
     movers, hot news. Chaque carte passe par guard() -- une absence s'affiche
     MANQUANT, jamais un repli silencieux. --------------------------------- */
  const feat=(()=>{const C=B.curator;if(!C||C.err||!C.v)return"";
    const mv=C.v.movers||[],wk=C.v.wakes||[],nw=C.v.news||[];
    const resolve=f=>{
      if(f.type==="mover"){const m=mv.find(x=>x.name===f.ref);
        return m?`<b>${esc(m.name)}</b> <span class="c ${m.chg_1d>0?"up":"dn"}">${m.chg_1d>0?"+":""}${nf(m.chg_1d,1)}%</span> <small>${esc(m.category||"")}</small>`:esc(f.ref);}
      if(f.type==="wake"){const w=wk.find(x=>x.ts===f.ref);
        return w?`réveil <b>${esc(w.label||"?")}</b> <span class="c ${w.ok?"up":"dn"}">${w.ok?"ok":"échec"}</span> <small>${esc((w.summary||"").slice(0,90))}</small>`:esc(f.ref);}
      if(f.type==="news"){const n=nw.find(x=>x.id===f.ref);
        return n?`<a href="${esc(n.url||"#")}" target="_blank" rel="noopener">${esc((n.headline||"").slice(0,90))}</a> <small>${esc(n.source||"")}</small>`:esc(f.ref);}
      return esc(f.ref);};
    return `<div class="sec"><h2>À la une</h2><p>sélection de l'agent curateur · référence + priorité, aucune conclusion écrite</p></div>
      <div class="card rv">${head("dashboard_curator · sélection",C)}
        <div class="bd"><div class="kpis" style="grid-template-columns:1fr">
          ${(C.v.featured||[]).map(f=>`<div class="kpi" data-tone="fl" style="text-align:left">
            <div class="l">${resolve(f)}</div><span class="bar"></span></div>`).join("")}
        </div></div></div>`;})();
  const sess=(()=>{const S=B.sessions;if(!S||S.err||!S.v)return"";
    const s=S.v.sessions||{};
    return `<div class="card rv">${head("Sessions de marché · calcul UTC",S)}
      <div class="bd"><div class="kpis" style="grid-template-columns:repeat(3,1fr)">
        ${Object.values(s).map(x=>`<div class="kpi" data-tone="${x.open?"held":"fl"}">
          <div class="l">${esc(x.label)}</div><div class="v" style="font-size:13px">${x.open?"ouvert":"fermé"}</div>
          <div class="note" style="padding:0;font-size:10px">${esc(x.window_utc)} UTC</div><span class="bar"></span></div>`).join("")}
      </div><div class="note">Heure normale, non ajustée DST.</div></div></div>`;})();
  const mov=`<div class="card rv">${head("Top movers protocoles · 24h",B.movers,B.movers&&B.movers.v?`<span class="chip">${B.movers.v.n_snapshot||0}/${B.movers.v.universe_total||"?"}</span>`:"")}
      ${guard(B.movers,m=>'<div class="bd"><div class="grid g-2">'+
        '<div><div class="note" style="padding:0 0 6px">Hausses</div>'+bars((m.gainers||[]).map(p=>({n:p.name,v:p.chg_1d,c:"g",
          lbl:(p.chg_1d>0?"+":"")+nf(p.chg_1d,1)+"% <small>"+esc(p.category||"")+"</small>"})))+'</div>'+
        '<div><div class="note" style="padding:0 0 6px">Baisses</div>'+bars((m.losers||[]).map(p=>({n:p.name,v:Math.abs(p.chg_1d),c:"r",
          lbl:nf(p.chg_1d,1)+"% <small>"+esc(p.category||"")+"</small>"})))+'</div>'+
        '</div><div class="note">CEX exclu (hors recherche DeFi) · '+esc(m.note||"")+'</div></div>',"movers")}</div>`;
  const wk=`<div class="card rv">${head("Derniers réveils · wake2.py (L4)",B.wakes)}
      ${guard(B.wakes,items=>'<div class="bd">'+(items||[]).slice(0,5).map(w=>`<div class="kpi" data-tone="${w.ok?"held":"broken"}" style="text-align:left">
          <div class="l"><b>${esc(w.label||"?")}</b> <small>${esc((w.ts||"").slice(0,16).replace("T"," "))} UTC</small></div>
          <div class="note" style="padding:2px 0 0">${w.ok?esc((w.summary||"(pas de résumé)").slice(0,140)):"réveil en échec — rien produit"}</div>
          <span class="bar"></span></div>`).join("")+'</div>',"wakes")}</div>`;
  const hn=`<div class="card rv">${head("Hot news · digest GLM, impact classé",B.hot_news)}
      ${guard(B.hot_news,h=>'<div class="bd">'+(h.news||[]).map(n=>`<div class="pxr">
          <span class="c ${n.impact==="value-accretive"?"up":n.impact==="adverse"?"dn":"fl"}">●</span>
          <a href="${esc(n.url||"#")}" target="_blank" rel="noopener" style="flex:1">${esc((n.headline||"").slice(0,90))}</a>
          <small>${esc(n.source||"")}</small></div>`).join("")+
        '<div class="note">'+((h.watchlist||[]).map(w=>esc(w.sym)+" "+(has(w.change_pct)?(w.change_pct>0?"+":"")+nf(w.change_pct,1)+"%":"")).join(" · "))+'</div></div>',"hot_news")}</div>`;
  return `${feat}
    <div class="sec"><h2>Sessions & movers</h2><p>0 LLM · contexte TradFi et instantané protocoles</p></div>
    <div class="grid g-2">${sess}${mov}</div>
    <div class="sec"><h2>Derniers réveils & hot news</h2><p>L4 (wake2.py) · digest GLM, impact classé (accretive/adverse/neutral)</p></div>
    <div class="grid g-2">${wk}${hn}</div>
    <div class="sec"><h2>Prix</h2><p>variation encodée par la forme autant que par la couleur</p></div>
    <div class="card rv">${head("crypto_server · /api/prices",B.prices)}
      ${guard(B.prices,p=>{
        const by={};(p.items||[]).forEach(i=>{(by[i.cat]=by[i.cat]||[]).push(i);});
        return '<div class="bd" style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))">'+
          Object.keys(by).sort().map(c=>`<div><div style="font:600 9.5px var(--mono);letter-spacing:.14em;
            text-transform:uppercase;color:var(--ink4);margin-bottom:7px">${esc(c)}</div>
            <div class="px">${by[c].map(i=>{
              const d=i.d,cl=!has(d)?"fl":d>0.05?"up":d<-0.05?"dn":"fl";
              return `<div class="pxr" data-s="${esc(i.sym+" "+i.name)}">
                <span class="sym">${esc(i.sym||"?")}<small>${esc(i.name||"")}</small></span>
                <span class="p">${price(i.p)||NA}</span>
                <span class="c ${cl}">${has(d)?(d>0?"+":"")+nf(d,2)+"%":"—"}</span></div>`;}).join("")}</div></div>`).join("")+
          '</div><div class="note" style="padding:0 14px 13px">Instantané au moment de la génération du flux — pas un ticker. L\'âge du bloc est affiché en tête de carte.</div>';
      },"prix")}</div>

    <div class="sec"><h2>État de la DeFi</h2><p>0 LLM · get_landscape + get_macro + fundamentals_history</p></div>
    <div class="grid g-2">
      <div class="card rv">${head("TVL par secteur",B.macro)}
        ${guard(B.macro,m=>'<div class="bd">'+bars((m.sectors||[]).map(s=>({n:s.name,v:s.tvl,
          lbl:(usd(s.tvl*1e9)||"—")+' <small>'+esc(s.yard)+"</small>"})))+"</div>","macro")}</div>
      <div class="card rv">${head("Fee-yield annualisé",B.macro,'<span class="chip">7 j lissés</span>')}
        ${guard(B.macro,m=>'<div class="bd">'+bars((m.fee_yield||[]).map(f=>({n:f.name,v:f.fy,c:"g",
          lbl:nf(f.fy,2)+'% <small>'+esc(f.sector)+"</small>"})))+
          '<div class="note">Fees PROTOCOLE ≠ accrual du TOKEN : le fee-switch ou le buyback se vérifient en gouvernance, pas dans cette barre.</div></div>',"macro")}</div>
      <div class="card rv">${head("Flux stablecoins par chaîne",B.macro,'<span class="chip">Δ 7 j</span>')}
        ${guard(B.macro,m=>'<div class="bd">'+bars((m.flows||[]).map(f=>({n:f.chain,v:f.d7,c:f.d7>0?"g":"r",
          lbl:(f.d7>0?"+":"")+nf(f.d7,1)+"M"})))+"</div>","macro")}</div>
      <div class="card rv">${head("TVL par chaîne",B.macro,'<span class="chip">top 10</span>')}
        ${guard(B.macro,m=>(m.chains||[]).length?'<div class="bd">'+bars((m.chains||[]).map(c=>({n:c.n,v:c.tvl_b,
          lbl:"$"+nf(c.tvl_b,2)+"B"})))+
          '<div class="note">api.llama.fi/v2/chains — l\'appel servait déjà à calculer la DeFi TVL agrégée ; son classement était jeté.</div></div>'
          :'<div class="bd"><div class="note">Classement des chaînes indisponible.</div></div>',"macro")}</div>
      <div class="card rv">${head("Agrégats",B.macro)}
        ${guard(B.macro,m=>{const a=m.agg||{};return `<div class="bd"><div class="bars">
          ${[["DeFi TVL",a.defi_tvl_b,"B"],["Stables mcap",a.stable_mcap_b,"B"],["DEX vol 24 h",a.dex_vol_24h_b,"B"]]
            .map(([n,v,u])=>`<div class="bar"><span class="n">${n}</span>
              <span class="t"><i style="width:${has(v)?100:0}%"></i></span>
              <span class="v">${has(v)?"$"+nf(v,1)+u:NA}</span></div>`).join("")}
          </div><div class="note">Variation stablecoins 7 j : ${has(a.stable_d7_pct)?
            `<b style="color:${a.stable_d7_pct>0?"var(--held)":"var(--broken)"}">${a.stable_d7_pct>0?"+":""}${nf(a.stable_d7_pct,2)} %</b> — le proxy du fresh money.`
            :NA+" (mesure indisponible)"}</div></div>`;},"macro")}</div>
    </div>

    <div class="sec"><h2>Connexion des briefs</h2>
      <p>0 LLM · la news leur parvient-elle, la citent-ils, en nourrissent-ils le corpus ?</p></div>
    <div class="card rv">${head("brief_wiring · relevé quotidien",B.wiring)}
      ${guard(B.wiring,w=>{const t=w.total||{},pt=w.par_tier||{};
        const pct=(a,b)=>b?Math.round(100*a/b):0;
        const tone=p=>p>=50?"held":p>=20?"warn":"broken";
        const kpi=(l,a,b,u)=>`<div class="kpi" data-tone="${tone(pct(a,b))}"><div class="l">${l}</div>
          <div class="v">${pct(a,b)}<small> %</small></div>
          <div class="note" style="padding:0;font-size:10.5px">${a} / ${b} ${u}</div><span class="bar"></span></div>`;
        return `<div class="bd">
        <div class="grid g-2" style="align-items:start">
          <div>${dgmChain(w)}

            faible, calculé à chaque rendu — il n'est pas choisi à la main.</p></div>
          <div>${dgmQuadrant(w)}
            <p class="dgm-note">Le croisement des axes n'est pas décoratif : abscisse = <b>médiane</b> de
            volume, ordonnée = <b>taux moyen du système</b>. Un tier en bas à droite produit beaucoup et
            transforme peu — c'est exactement la question posée à la mission.</p></div>
        </div>
        <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));margin-top:14px">
          ${kpi("La news leur PARVIENT",t.recu||0,t.briefs||0,"briefs")}
          ${kpi("Ils la CITENT",t.media||0,t.briefs||0,"briefs nomment un média")}
          ${kpi("Elle NOURRIT le corpus",t.notes_evenement||0,t.notes||0,"notes événementielles")}
        </div>
        <div style="margin-top:12px">${bars(Object.entries(pt).map(([k,v])=>({
          n:"tier "+k, v:pct(v.notes_evenement||0,v.notes||0), c:"g",
          lbl:(v.media||0)+"/"+(v.briefs||0)+' cite <small>· '+(v.notes_evenement||0)+"/"+(v.notes||0)+" notes</small>"})))}</div>
        <div class="note">Fenêtre ${w.window_days} j. ${esc(w.note||"")}</div></div>`;},"wiring")}</div>

    <div class="sec"><h2>Classement par catégorie</h2>
      <p>0 LLM · get_landscape → protocol_tvl · ${(B.macro&&B.macro.v&&B.macro.v.n_protocols)||0} protocoles sur 95 suivis</p></div>
    ${guard(B.macro,m=>{
      const cats=m.by_category||[];
      if(!cats.length) return '<div class="card rv"><div class="bd"><div class="note">Classement indisponible.</div></div></div>';
      return '<div class="grid g-2">'+cats.map(c=>`<div class="card rv">
        <div class="hd"><span class="t">${esc(c.cat)}</span><span class="chip">${c.n}</span></div>
        <div class="bd">${bars((c.p||[]).map(p=>({n:p.n,v:p.tvl_b,

      </div>`).join("")+'</div>'+
      '<div class="note" style="padding:10px 4px 0">Ordre de priorité de RECHERCHE, pas de TVL — c\'est celui dans lequel la couche GLM les reçoit depuis le 08/08. Les CEX ferment la marche : leur classement n\'est pas de la recherche DeFi.</div>';
    },"macro")}`;
};

V.news=(D)=>`<div class="sec"><h2>Fil</h2><p>cliquable · source, âge et sentiment lisibles d'un coup d'œil</p>

V.secteurs=(D)=>{
  const B=D.blocks;
  const tracker=(name,bk,extra)=>`<div class="card rv">${head(name,bk,extra)}
    ${guard(bk,r=>`<div class="bd">
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,132px),1fr));margin-bottom:12px">

      ${r.spark?`<div style="margin-bottom:12px">${r.spark}</div>`:""}

        // La synthèse est QUOTIDIENNE : son âge est distinct de celui des données

          <div class="tx open" style="padding:0 11px 12px">${md(r.synth)}</div></details>`;})()

  const rhV=B.robinhood&&B.robinhood.v;
  const rwaV=B.rwa&&B.rwa.v;

           ["Part Morpho",has(rhV.morpho_share_pct)?rhV.morpho_share_pct+" <small>%</small>":NA,""],

    spark:(rhV.history||[]).length?spark(rhV.history.map(h=>h.v),320,52,"var(--acc2)"):"",
    synth:rhV.synth,synth_ts:rhV.synth_ts}}:B.robinhood;
  const rwaBk=rwaV?{...B.rwa,v:{
    cards:[["TVL secteur",has(rwaV.tvl_b)?"$"+nf(rwaV.tvl_b,2)+"B":NA,""],
           ["Δ 7 j",has(rwaV.chg_7d)?(rwaV.chg_7d>0?"+":"")+nf(rwaV.chg_7d,2)+" <small>%</small>":NA,
             has(rwaV.chg_7d)?(rwaV.chg_7d>0?"held":"broken"):""],
           ["Protocoles",has(rwaV.n_protocols)?rwaV.n_protocols:NA,""]],
    spark:(rwaV.history||[]).length?spark(rwaV.history.map(h=>h.v),320,52,"var(--held)"):"",
    extra:`<div class="grid g-2" style="gap:11px;margin-bottom:12px">
      <div><div style="font:600 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);margin-bottom:6px">Hausses 7 j</div>

V.agent=(D)=>{
  const B=D.blocks||{};
  const wk=((B.wakes&&B.wakes.v)||[]).slice().sort((a,b)=>String(b.ts||"").localeCompare(String(a.ts||"")));
  const br=((B.briefs&&B.briefs.v)||[]).slice().sort((a,b)=>String(b.ts||"").localeCompare(String(a.ts||"")));
  const it=(B.watches&&B.watches.v&&B.watches.v.items)||[];
  const inq=((B.inquiries&&B.inquiries.v)||[]);
  const rx=(B.reflex&&B.reflex.v)||null;
  const esc=s=>String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const dt=s=>String(s||"").replace("T"," ").replace("Z","").slice(0,16);
  const SRC={L3:"GLM",L4:"brain",NEWS:"news"};
  const fmt=v=>{const n=Number(v);if(!isFinite(n))return esc(v);
    if(Math.abs(n)>=1e9)return (n/1e9).toFixed(2)+" Md";
    if(Math.abs(n)>=1e6)return (n/1e6).toFixed(1)+" M";
    if(Math.abs(n)>=1e3)return (n/1e3).toFixed(0)+" k";return String(n);};

  // 1. LA DERNIERE CONCLUSION — ce que l'agent a retenu, dans ses mots.
  const w0=wk[0];
  const concl=!w0?`<p>aucun réveil enregistré</p>`:
    `<p class="dgm-note" style="opacity:.8">${dt(w0.ts)} · ${esc(w0.label||"")} · ${esc(w0.model||"")}
      · ${w0.dur_s?Math.round(w0.dur_s)+" s":"—"} · <b>${esc(w0.publish||"—")}</b></p>
     <p style="font-size:1.02rem;line-height:1.5">${w0.summary?esc(w0.summary):
       "<i>aucun résumé — le réveil n'a pas conclu au format que le harnais sait lire</i>"}</p>
     <p class="dgm-note">${w0.watches||0} veille(s) émise(s) ce réveil.</p>`;

  // 2. CE QUI TOMBE BIENTOT — l'engagement qui va etre tranche, c'est ce qui compte demain.
  const ouv=it.filter(w=>w.verdict==="OPEN").sort((a,b)=>(a.due_h==null?1e9:a.due_h)-(b.due_h==null?1e9:b.due_h));
  const proches=ouv.slice(0,8).map(w=>{
    const due=w.due_h==null?"—":(w.due_h<0?`<b>échue depuis ${Math.abs(Math.round(w.due_h))} h</b>`:
      (w.due_h<48?`<b>dans ${Math.round(w.due_h)} h</b>`:`dans ${Math.round(w.due_h/24)} j`));
    return `<p class="dgm-note"><b>${esc(w.entity)}</b> · ${esc(w.metric)} ${esc(w.op)}
      ${fmt(w.threshold)} — ${due} <span style="opacity:.6">[${SRC[w.src]||esc(w.src)}]</span></p>`;}).join("");

  // 3. CE QUI VIENT D'ETRE TRANCHE — avec l'ecart mesure, jamais un simple oui/non.
  const dec=it.filter(w=>w.verdict==="HELD"||w.verdict==="BROKEN")
    .sort((a,b)=>String(b.decided||"").localeCompare(String(a.decided||""))).slice(0,6).map(w=>
    `<p class="dgm-note"><span style="color:var(--${w.verdict==="HELD"?"held":"broken"})">
      <b>${w.verdict==="HELD"?"TENU":"CASSÉ"}</b></span> ${esc(w.entity)} · ${esc(w.metric)}
      ${esc(w.op)} ${fmt(w.threshold)}${w.observed_pct!=null?` — mesuré ${w.observed_pct} %`:
      (w.current!=null?` — mesuré ${fmt(w.current)}`:"")}
      <span style="opacity:.6">[${SRC[w.src]||esc(w.src)}]</span></p>`).join("");

  // 4. SES QUESTIONS — le seul objet qui traverse les sessions.
  const qs=inq.slice(0,5).map(q=>{
    const ev=(q.evidence&&q.evidence[0])||null;
    return `<div class="card rv"><div class="bd">
      <p><b>${esc(q.q||q.id)}</b></p>
      <p class="dgm-note">${q.touches||0} touches · ouverte depuis ${q.born?dt(q.born).slice(0,10):"?"}
        ${q.dormant?" · <b>dormante</b>":""} · dernière note il y a ${q.age_d==null?"?":q.age_d+" j"}</p>
      ${ev?`<p class="dgm-note" style="opacity:.85">« ${esc(String(ev.note||"").slice(0,240))} »</p>`:
        `<p class="dgm-note"><i>aucune note</i></p>`}
    </div></div>`;}).join("");

  const b0=br[0];
  return `<div class="sec"><h2>Sa dernière conclusion</h2>
      <p>le réveil le plus récent, dans ses mots — le harnais n'en extrait que la forme</p></div>
    <div class="card rv">${head("brain_wakes",B.wakes)}<div class="bd">${concl}</div></div>

    <div class="sec"><h2>Ce qui tombe bientôt</h2>
      <p>${ouv.length} engagement(s) en cours — les 8 plus proches de leur échéance</p></div>
    <div class="card rv"><div class="bd">${proches||"<p>aucun engagement ouvert</p>"}</div></div>

    <div class="sec"><h2>Ce qui vient d'être tranché</h2></div>
    <div class="card rv"><div class="bd">${dec||"<p>aucun verdict rendu</p>"}</div></div>

    <div class="sec"><h2>Ses questions ouvertes</h2>
      <p>le seul objet qui traverse les sessions — une question sans note depuis des semaines est dormante</p></div>
    ${qs||`<div class="card rv"><div class="bd"><p>aucune enquête ouverte</p></div></div>`}

    <div class="sec"><h2>Le dernier brief, et le réflexif</h2></div>
    <div class="card rv"><div class="bd">
      <p class="dgm-note">${b0?`<b>tier ${esc(b0.tier)}</b> · ${dt(b0.ts)} · ${esc(b0.mode||"")} ·
        discipline ${b0.discipline} · R2 ${b0.r2_pass?"passé":"<b>ÉCHOUÉ</b>"}${b0.silent?" · SILENCE":""}`
        :"aucun brief"}</p>
      <p class="dgm-note">${rx&&rx.date?`réflexif du ${esc(rx.date)} — ${rx.n} enquête(s) relues sur tout le corpus`
        :"réflexif : aucune synthèse"}</p>
    </div></div>`;
};

V.sante=(D)=>{
  const B=D.blocks||{},st=D.status||{};
  const W=(B.watches&&B.watches.v)||{},S=W.stats||{},J=(B.jobs&&B.jobs.v)||{};
  const bud=(B.health&&B.health.v&&B.health.v.budget)||{};
  const num=v=>(v===null||v===undefined)?"—":v;
  // AGE DU RELEVE : un chiffre juste mais vieux est un chiffre faux pour qui surveille.
  const ageH=(()=>{const t=Date.parse(D.generated_at||"");return isFinite(t)?(Date.now()-t)/36e5:null;})();
  // LES ALERTES SE COMPTENT, ELLES NE SE DECRETENT PAS.
  const failed=(D.failed_blocks||[]).length, vide=J.vide||0;
  const stale=Object.keys(B).filter(k=>B[k]&&B[k].err).length;
  const vieux=(ageH!==null&&ageH>4)?1:0;
  const alertes=failed+vide+stale+vieux;
  const lignes=[];
  if(failed) lignes.push(`${failed} bloc(s) en échec à la génération`);
  if(vide)   lignes.push(`${vide} job(s) LLM produisent du vide`);
  if(stale)  lignes.push(`${stale} bloc(s) en erreur`);
  if(vieux)  lignes.push(`relevé vieux de ${ageH.toFixed(1)} h`);
  // LES PRODUCTEURS : c'est la vraie question — qui emet, et est-ce que ca tient ?
  const SRC={L3:["GLM · briefs","tier A, 3-phase"],L4:["brain · réveils","kimi, 2×/jour"],
             NEWS:["instructeur · fil","événement → prédicat"]};
  const bysrc=S.by_src||{}, waste=(S.waste&&S.waste.by_src)||{};
  const prod=Object.keys(SRC).filter(k=>bysrc[k]||waste[k]).map(k=>{
    const r=bysrc[k]||{},w=waste[k]||{};
    const rate=(r.rate===null||r.rate===undefined)?null:r.rate;
    return `<div class="card rv"><div class="bd">
      <div class="l" style="opacity:.75">${SRC[k][0]} — <i>${SRC[k][1]}</i></div>
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr));margin-top:.5rem">
        <div class="kpi"><div class="l">émises</div><div class="v">${num(w.emitted)}</div><span class="bar"></span></div>
        <div class="kpi" data-tone="open"><div class="l">en cours</div><div class="v">${num(r.open)}</div><span class="bar"></span></div>
        <div class="kpi" data-tone="${rate===null?"warn":(rate>=19?"held":"broken")}">
          <div class="l">tenues</div><div class="v">${rate===null?"—":rate+" %"}</div><span class="bar"></span></div>
        <div class="kpi" data-tone="${(w.rate||0)>30?"broken":"warn"}"><div class="l">déchet</div>
          <div class="v">${w.rate===null||w.rate===undefined?"—":w.rate+" %"}</div><span class="bar"></span></div>
      </div>
      ${rate===null?`<p class="dgm-note">Aucun verdict rendu pour l'instant — les échéances courent.
        Un producteur sans verdict n'est pas un producteur sans valeur : c'est un producteur trop jeune.</p>`:""}
    </div></div>`;}).join("");
  const lr=st.last_run||{};
  return `<div class="sec"><h2>${alertes?`${alertes} point${alertes>1?"s":""} à regarder`:"Tout tourne"}</h2>
      <p>${alertes?lignes.join(" · "):"aucun bloc en échec, aucun job à vide, relevé frais"}</p></div>

    <div class="card rv"><div class="bd">
      <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr))">
        <div class="kpi" data-tone="${alertes?"broken":"held"}"><div class="l">alertes</div>
          <div class="v">${alertes}</div><span class="bar"></span></div>
        <div class="kpi"><div class="l">relevé</div>
          <div class="v">${ageH===null?"—":(ageH<1?Math.round(ageH*60)+" min":ageH.toFixed(1)+" h")}</div><span class="bar"></span></div>
        <div class="kpi"><div class="l">veilles émises aujourd'hui</div>
          <div class="v">${num(S.issued_today)}</div><span class="bar"></span></div>
        <div class="kpi"><div class="l">tranchées aujourd'hui</div>
          <div class="v">${num(S.decided_today)}</div><span class="bar"></span></div>
      </div></div></div>

    <div class="sec"><h2>Les producteurs de prédicats</h2>
      <p>« tenues » = HELD-rate ; le hasard donne 14,8 %, la règle 0-LLM 49,1 % — un producteur se lit contre eux, jamais seul</p></div>
    ${prod||`<div class="card rv"><div class="bd"><p>aucun producteur dans le registre</p></div></div>`}

    <div class="sec"><h2>Les jobs à modèle</h2></div>
    <div class="card rv">${head("jobs_wiring",B.jobs)}
      ${guard(B.jobs,j=>`<div class="bd">
        <div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,110px),1fr))">
          <div class="kpi"><div class="l">jobs suivis</div><div class="v">${j.n}</div><span class="bar"></span></div>
          <div class="kpi" data-tone="${j.vide?"broken":"held"}"><div class="l">à vide</div><div class="v">${j.vide}</div><span class="bar"></span></div>
          <div class="kpi" data-tone="${j.arretes?"broken":"held"}"><div class="l">arrêtés</div><div class="v">${j.arretes}</div><span class="bar"></span></div>
          <div class="kpi" data-tone="warn"><div class="l">mesurés</div><div class="v">${j.couverts}/${j.n}</div><span class="bar"></span></div>
        </div>
        ${(j.jobs||[]).filter(x=>x.vide||!x.tourne).map(x=>`<p class="dgm-note">
          <b>${x.nom}</b> — ${x.tourne?"produit du vide":"ne tourne plus"} · ${x.log||"?"}</p>`).join("")||
          `<p class="dgm-note">Les ${j.n-j.couverts} jobs sans prédicat ne sont pas « sains » :

    <div class="sec"><h2>Le dernier brief, et le budget</h2></div>

        :"aucun run enregistré"}</p>
      ${Object.keys(bud.counts||{}).map(m=>`<p class="dgm-note">${m} : <b>${bud.counts[m]}</b> appels
        ${bud.caps&&bud.caps[m]?`sur ${bud.caps[m]}`:""}</p>`).join("")||""}
    </div></div>`;
};

   ══════════════════════════════════════════════════════════════════ */
const TITLES={agent:["L'agent","ce qu'il a conclu, ce sur quoi il s'engage, ce qui vient d'être tranché"],
  sante:["Santé","l'agent tourne-t-il, et produit-il quelque chose de jugeable ?"],
  poste:["Poste de commande","ce qui a changé, et ce qui vient de casser"],
  veilles:["Veilles falsifiables","le registre des prédicats datés"],
  briefs:["Briefs","la recherche publiée"],theses:["Thèses","le livre, append-only"],
  enquetes:["Enquêtes-mission","les questions permanentes"],
  marche:["Marché","prix et fondamentaux"],news:["Fil","les sources, cliquables"],
  secteurs:["Secteurs","trackers RWA et Robinhood Chain"],
  systeme:["Système","le harness se regarde fonctionner"]};
let DATA=null,CUR="poste";

/* ── MOTIFS AMBIANTS (s56b) ───────────────────────────────────────────────
   Dessin temps reel sur <canvas>. Remplace cinq WebP pre-rendus de 331 Ko.

   Ornement, jamais de la donnee : pas d'axe, pas de barre, pas de compteur.
   Un motif dessine ne peut pas dire la verite sur un chiffre, il n'a donc pas
   le droit d'y ressembler.

   Pourquoi le canvas plutot qu'un fichier :
     . net a n'importe quelle definition, y compris 4K et au-dela
     . ~4 Ko de code contre 331 Ko d'images
     . lit les jetons CSS du terminal -> vit dans les DEUX themes
     . additif sur fond sombre, multiplicatif sur fond clair : meme geometrie,
       deux modes de composition, parce qu'un halo additif lave un fond clair
                                                                            */
const MOTIFS={poste:"boucle",veilles:"predicat",theses:"divergence",news:"fil",systeme:"reveil"};
function motifBar(v){
  const m=MOTIFS[v];
  return m?'<div class="motifbar"><canvas class="motif" data-m="'+m+'" aria-hidden="true"></canvas></div>':"";
}

const Motif=(function(){
  let raf=0,cv=null,g=null,kind="",S=0,dpr=1,light=false,P=null,t0=0,io=null;
  const sprites=new Map();
  const tok=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  function rgb(h){
    h=(h||"#888").replace("#","");
    if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0];
  }
  function palette(){
    light=getComputedStyle(document.documentElement).colorScheme.indexOf("light")===0;
    sprites.clear();
    P={acc:rgb(tok("--acc")),acc2:rgb(tok("--acc2")),held:rgb(tok("--held")),
       broken:rgb(tok("--broken")),open:rgb(tok("--open")),warn:rgb(tok("--warn")),
       ink:rgb(tok("--ink")),bg:tok("--bg")||"#080b16"};
  }
  /* t quantifie au 1/8 : borne le cache de sprites a une poignee d'entrees */
  function mix(a,b,t){t=Math.max(0,Math.min(1,Math.round(t*8)/8));
    return [a[0]+(b[0]-a[0])*t|0,a[1]+(b[1]-a[1])*t|0,a[2]+(b[2]-a[2])*t|0];}

  function spr(c){
    const k=c[0]+","+c[1]+","+c[2];let s=sprites.get(k);if(s)return s;
    const N=64;s=document.createElement("canvas");s.width=s.height=N;
    const x=s.getContext("2d"),gr=x.createRadialGradient(N/2,N/2,0,N/2,N/2,N/2),v=k;
    gr.addColorStop(0,"rgba("+v+",1)");gr.addColorStop(.42,"rgba("+v+",.40)");
    gr.addColorStop(1,"rgba("+v+",0)");
    x.fillStyle=gr;x.fillRect(0,0,N,N);sprites.set(k,s);return s;
  }
  function dot(x,y,r,c,a){
    if(!(a>.005)||!(r>.15))return;
    g.globalAlpha=a>1?1:a;g.drawImage(spr(c),x-r,y-r,r*2,r*2);
  }

  /* ── les cinq motifs. T dans [0,1), boucle parfaite. ─────────────────── */
  const F={
    /* la circulation : un circuit ferme qu'une charge parcourt */
    boucle(T,W){
      const c=W/2,R=W*.345,tl=.44,N=132;
      for(let i=0;i<N;i++){
        const a=i/N*6.2832,z=Math.sin(a)*R,d=(Math.cos(tl)*z/R+1)/2;
        let p=(i/N-T)%1;if(p<0)p+=1;
        const near=Math.min(p,1-p),head=Math.exp(-near*near/6e-4),tail=Math.exp(-p*p/.055);
        dot(c+Math.cos(a)*R,c+z*Math.sin(tl),
            (W*.012+W*.017*d)*(1+1.7*head),
            head>.2?P.ink:mix(P.acc2,P.acc,.2+.8*tail),
            (.10+.34*d)*(.30+.75*tail+2.2*head));
      }
    },
    /* une affirmation tendue vers l'avenir : elle tient, ou elle casse */
    predicat(T,W){
      const c=W/2,br=.5-.5*Math.cos(T*6.2832),reach=W*(.26+.11*br),
            thin=W*.030-W*.016*br,col=mix(P.held,P.broken,Math.pow(br,1.5)),N=84;
      for(let i=0;i<=N;i++){
        const u=i/N,x=c-reach+2*reach*u,
              w=Math.sin(u*3.1416),
              y=c+Math.sin(u*8.4+T*12.57)*W*.055*(1-br)*w;
        dot(x,y,thin*(.6+.8*w),col,.30+.36*br);
      }
      for(const s of[-1,1]){
        dot(c+s*reach,c,W*.085,col,.32);
        dot(c+s*reach,c,W*.040,P.ink,.52);
      }
    },
    /* trois battements par cycle, puis le repos */
    reveil(T,W){
      const c=W/2,N=96;
      for(let k=0;k<3;k++){
        let p=(T-k/3)%1;if(p<0)p+=1;
        const fade=Math.max(0,1-p*2.4);if(fade<=0)continue;
        const rad=W*(.10+.36*Math.pow(p,.55)),
              col=mix(P.open,P.acc,Math.min(1,Math.pow(p,.55)*1.2)),
              a=fade*fade*.38;
        for(let i=0;i<N;i++){
          const t=i/N*6.2832;
          dot(c+Math.cos(t)*rad,c+Math.sin(t)*rad,W*.032,col,a);
        }
      }
      const beat=Math.max(0,1-((T*3)%1)*3.2);
      dot(c,c,W*.105*(1+.40*beat*beat),P.acc,.22+.30*beat*beat);
      dot(c,c,W*.055*(1+.30*beat*beat),P.ink,.34+.40*beat*beat);
      dot(c,c,W*.026,P.open,.60);
    },
    /* l'ingestion laminaire qui se depose en strates de corpus */
    fil(T,W){
      const N=44;
      for(let k=0;k<7;k++){
        const off=k/7;let d=(T+off)%1;
        const y0=W*(.10+.60*d),
              fade=Math.min(1,d*5)*Math.min(1,(1-d)*3.4),
              col=mix(P.acc2,P.open,off);
        for(let i=0;i<N;i++){
          const u=i/N,x=W*(.08+.84*u),
                env=Math.sin(u*3.1416),
                y=y0+Math.sin(u*4.2+off*6)*W*.045;
          dot(x,y,W*.034*env,col,.26*fade*env);
        }
      }
      for(let k=0;k<4;k++){
        const y=W*(.775+k*.048),col=mix(P.acc,P.ink,.12+.14*k);
        for(let i=0;i<N;i++){
          const u=i/N,env=Math.sin(u*3.1416);
          dot(W*(.08+.84*u),y,W*.030*env,col,.20*env);
        }
      }
    },
    /* un concept en plusieurs copies, derivant hors phase */
    divergence(T,W){
      const c=W/2,sp=.34+.66*(.5-.5*Math.cos(T*6.2832)),rot=T*6.2832,
            tints=[P.ink,P.acc,P.acc2,P.warn];
      for(let k=0;k<4;k++){
        const ang=k/4*6.2832+rot,rad=W*.315*sp*(k?1:.40),ph=T*6.2832+k*1.7,
              x=c+Math.cos(ang)*rad+W*.022*Math.cos(ph*1.3),
              y=c+Math.sin(ang)*rad*.66+W*.042*Math.sin(ph),
              r=W*.098+W*.014*Math.sin(ph*2);
        for(let i=0;i<3;i++)dot(x,y,r*(1+i*.5),tints[k],(k?.26:.34)/(1+i*1.35));
      }
      const link=(1-sp)*.30;
      if(link>.01)for(let i=0;i<56;i++){
        const t=i/56*6.2832,rr=W*(.05+.16*sp);
        dot(c+Math.cos(t)*rr,c+Math.sin(t)*rr,W*.024,P.ink,link);
      }
    }
  };
  const PERIOD={boucle:6200,predicat:5200,reveil:6000,fil:8200,divergence:7000};

  function size(){
    const r=cv.getBoundingClientRect();
    dpr=Math.min(devicePixelRatio||1,2.5);
    S=Math.max(32,Math.round(r.width*dpr));
    if(cv.width!==S){cv.width=S;cv.height=S;}
  }
  function frame(now){
    raf=0;if(!cv||!cv.isConnected)return;
    const T=((now-t0)%PERIOD[kind])/PERIOD[kind];
    g.globalCompositeOperation="source-over";g.globalAlpha=1;
    g.fillStyle=P.bg;g.fillRect(0,0,S,S);
    /* additif sur fond sombre ; sur fond clair il laverait tout en blanc */
    g.globalCompositeOperation=light?"multiply":"lighter";
    F[kind](T,S);
    g.globalAlpha=1;
    if(!paused)raf=requestAnimationFrame(frame);
  }
  let paused=false;
  function start(){if(!raf&&cv&&!paused)raf=requestAnimationFrame(frame);}
  function stop(){if(raf)cancelAnimationFrame(raf);raf=0;}

  function wire(){
    stop();io&&io.disconnect();
    cv=document.querySelector("canvas.motif");
    if(!cv)return;
    kind=cv.dataset.m;if(!F[kind])return;
    g=cv.getContext("2d",{alpha:false});
    palette();size();t0=performance.now();
    const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
    /* Une image peinte TOUT DE SUITE, en synchrone. Si l'on s'en remet au
       premier rAF, le canvas reste vide tant qu'il n'a pas tire — onglet en
       arriere-plan, page non composee, observer pas encore declenche. */
    paused=still;
    frame(t0+(still?PERIOD[kind]*.22:0));
    if(still)return;
    io=new IntersectionObserver(e=>{paused=!e[0].isIntersecting;paused?stop():start();},{rootMargin:"80px"});
    io.observe(cv);
    start();
  }
  addEventListener("resize",()=>{if(cv){size();if(paused)frame(performance.now());}},{passive:true});
  document.addEventListener("visibilitychange",()=>{
    if(document.hidden){paused=true;stop();}
    else if(cv&&!matchMedia("(prefers-reduced-motion: reduce)").matches){paused=false;start();}
  });
  /* le bouton de theme change les jetons : la palette se relit, elle ne se devine pas */
  new MutationObserver(()=>{if(cv){palette();if(paused)frame(performance.now());}})
    .observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  /* paint(T) : peint un instant precis du cycle. C'est le chemin utilise pour
     l'image fixe en reduced-motion, et il sert aussi a inspecter le rendu. */
  function paint(T){if(cv&&F[kind])frame(t0+PERIOD[kind]*(T%1));}
  return {wire,paint};
})();

function renderView(v,keepScroll){
  CUR=v;
  const sy=keepScroll?window.scrollY:0;
  const t=TITLES[v]||[v,""];
  $("vtitle").textContent=t[0];$("vsub").textContent=t[1];
  document.querySelectorAll("#nav a").forEach(a=>{
    const on=a.dataset.v===v;a.classList.toggle("on",on);
    if(on){a.setAttribute("aria-current","page");
      // barre d'onglets scrollable : garder l'onglet actif dans le champ de vision
      if(innerWidth<=900&&a.scrollIntoView)
        a.scrollIntoView({inline:"center",block:"nearest",
          behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"});
    }else a.removeAttribute("aria-current");});
  try{ $("views").innerHTML=`<section class="view on">${motifBar(v)}${(V[v]||V.poste)(DATA)}</section>`; }
  catch(err){ $("views").innerHTML=`<div class="card"><div class="missing"><b>erreur de rendu</b>${esc(err.message)}</div></div>`;
    console.error(err); }
  Motif.wire();
  if(v==="veilles")wireWatches();
  if(v==="briefs")wireBriefs();
  if(v==="news")wireNews();
  applyFilter($("q").value);
  dgScroll();
  window.scrollTo({top:sy,behavior:"instant"});
}
/* L'invite « faites glisser » se MESURE, elle ne se suppose pas : un schéma
   qui tient dans sa carte ne doit pas annoncer un débordement inexistant.
   Sur téléphone, un schéma large défile dans son propre conteneur plutôt
   que de rétrécir sa typographie jusqu'à l'illisible — même règle que les
   tableaux (.tw), pour que la page, elle, ne défile jamais horizontalement. */
function dgScroll(){
  document.querySelectorAll(".dgm").forEach(d=>{
    d.dataset.scroll=d.scrollWidth>d.clientWidth+2?"1":"0";});
}
addEventListener("resize",dgScroll,{passive:true});

/* filtres locaux par vue */
function chipRow(el,opts,cur,cb){
  el.innerHTML=opts.map(o=>`<button class="fb" type="button" data-f="${esc(o[0])}"
    aria-pressed="${o[0]===cur}">${esc(o[1])}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest("[data-f]");if(!b)return;
    [...el.children].forEach(c=>c.setAttribute("aria-pressed",String(c===b)));cb(b.dataset.f);};
}
function wireWatches(){
  const bk=DATA.blocks.watches;
  if(!bk||bk.err||!bk.v){$("wlist").innerHTML=guard(bk,()=>"","veilles");return;}
  const items=bk.v.items||[];let cur="tous";
  const draw=()=>{
    const sel=items.filter(w=>cur==="tous"||w.verdict===cur);
    $("wlist").innerHTML=sel.length?`<div class="watches">${sel.map(watchCard).join("")}</div>`
      :'<div class="card"><div class="empty">aucune veille pour ce filtre</div></div>';
    applyFilter($("q").value);};
  chipRow($("wfilters"),[["tous","tous"],["BROKEN","falsifiés"],["OPEN","ouverts"],["HELD","tenus"],
    ["UNEVALUABLE","non évaluables"]],cur,f=>{cur=f;draw();});
  draw();
}
function wireBriefs(){
  const bk=DATA.blocks.briefs;
  if(!bk||bk.err||!bk.v){$("blist").innerHTML=guard(bk,()=>"","briefs");return;}
  const bs=bk.v;let cur="tous";
  const draw=()=>{
    const sel=bs.filter(b=>cur==="tous"?true:cur==="silent"?b.silent
      :cur==="tué"?b.status==="killed":b.tier===cur);
    $("blist").innerHTML=sel.map(briefCard).join("")||'<div class="empty">aucun brief pour ce filtre</div>';
    applyFilter($("q").value);};
  chipRow($("bfilters"),[["tous","tous"],["A","A"],["S","S"],["B","B"],["W","W"],
    ["silent","silencieux"],["tué","tués"]],cur,f=>{cur=f;draw();});
  draw();
}
function wireNews(){
  const bk=DATA.blocks.news;
  if(!bk||bk.err||!bk.v){$("nlist").innerHTML=guard(bk,()=>"","fil");return;}
  const its=bk.v.items||[];let cur="tous";
  const draw=()=>{
    const sel=its.filter(n=>cur==="tous"||n.sent===cur||n.cat===cur);
    $("nlist").innerHTML=sel.length?`<div class="news">${sel.map(n=>`
      <a class="nw" href="${esc(n.url||"#")}" target="_blank" rel="noopener noreferrer"
         data-s="${esc((n.t||"")+" "+(n.src||"")+" "+(n.sum||""))}">
        <div class="h"><span style="color:var(--ink2);font-weight:600">${esc(n.src||"?")}</span>
          <span>·</span><span>${ago(n.pub)||"?"}</span>
          <span class="sent" data-s="${esc(n.sent||"neutral")}">${esc(n.sent||"?")}</span>
          ${n.cat?`<span class="chip" style="font-size:9.5px">${esc(n.cat)}</span>`:""}
          <svg class="ext" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" style="margin-left:auto" aria-hidden="true"><path d="M6 3h7v7M13 3L4 12"/></svg></div>
        <div class="ti">${esc(n.t||"(sans titre)")}</div>
        ${n.sum?`<div class="su">${esc(n.sum)}</div>`:""}</a>`).join("")}</div>`
      :'<div class="empty">aucun article pour ce filtre</div>';
    applyFilter($("q").value);};
  chipRow($("nfilters"),[["tous","tout"],["bullish","haussier"],["bearish","baissier"],
    ["neutral","neutre"],["defi","defi"],["alert","alertes"]],cur,f=>{cur=f;draw();});
  draw();
}

/* recherche globale */
function applyFilter(q){
  q=String(q||"").trim().toLowerCase();
  document.querySelectorAll("[data-s]").forEach(el=>{
    el.style.display=!q||el.dataset.s.toLowerCase().includes(q)?"":"none";});
}

/* ruban de fraîcheur */
function renderRibbon(D){
  const ks=Object.keys(D.blocks||{});
  const chips=ks.map(k=>{const f=freshness(D.blocks[k]);
    return `<span class="fchip ${f.cls}" title="${esc(D.blocks[k].src||"")}"><i></i>${esc(LBL[k]||k)} ${f.txt}</span>`;}).join("");
  const bad=ks.filter(k=>freshness(D.blocks[k]).cls==="dead").length;
  // La dormance est un ÉTAT, pas un événement : elle vit dans le ruban, en permanence
  // et sans crier. L'alerte est réservée à ce qui vient de se produire.
  const th=(D.blocks.theses&&D.blocks.theses.v)||{},iq=(D.blocks.inquiries&&D.blocks.inquiries.v)||[];
  const dt=th.n_dormant||0,di=iq.filter(q=>q.dormant).length;
  const dorm=(dt||di)?`<span class="fchip warn" title="aucun verdict / aucune note depuis ${th.dormant_days||7} jours — l'agent ne les touche plus">
      <i></i>dormant ${dt} thèses · ${di} enquêtes</span>`:"";
  $("ribbon").className="ribbon";
  $("ribbon").innerHTML=`<span class="lb">Fraîcheur</span>${chips}${dorm}
    <button type="button" id="refresh" class="fchip" style="margin-left:auto;cursor:pointer"
      title="Le flux est régénéré toutes les 2 h. Appuyer pour re-télécharger maintenant.">
      <i style="background:var(--acc)"></i><span>flux ${ago(D.generated_at)||"?"}</span>
      <svg viewBox="0 0 16 16" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 8a6 6 0 1 1-1.8-4.3M14 2v4h-4"/></svg></button>`;
  const lr=(D.status||{}).last_run||{};
  const m=minAgo(lr.ts);
  const cls=bad?"ko":m>8*60?"warn":"ok";
  $("pulse").className="pulse "+cls;
  $("pulse-t").textContent=bad?bad+" bloc"+(bad>1?"s":"")+" en échec":m>8*60?"silence "+(ago(lr.ts)||""):"brain vivant";
}

/* boot */
function boot(D,isRefresh){
  DATA=D;
  const B=D.blocks||{};
  const wv=B.watches&&B.watches.v;
  const nOpen=wv?(wv.stats.by_verdict.OPEN||0):null;
  const nBroken=wv?(wv.items||[]).filter(w=>w.verdict==="BROKEN"&&has(w.due_h)&&w.due_h>-72).length:0;
  const set=(id,v,hot)=>{const e=$(id);if(!e)return;
    if(!has(v)){e.textContent="";return;} e.textContent=v; if(hot)e.classList.add("hot");};
  set("n-w",nBroken?nBroken:nOpen,!!nBroken);
  set("n-b",(B.briefs&&B.briefs.v||[]).length);
  set("n-t",((B.theses&&B.theses.v&&B.theses.v.items)||[]).filter(t=>t.verdict!=="retire").length);
  set("n-i",(B.inquiries&&B.inquiries.v||[]).length);
  set("n-n",(B.news&&B.news.v&&B.news.v.n)||null);
  renderRibbon(D);
  const failed=(D.failed_blocks||[]);
  $("foot").innerHTML=`schema_version ${D.schema_version} · flux généré ${stamp(D.generated_at)}
    en ${D.gen_ms??"?"} ms · ${Object.keys(B).length} blocs${failed.length?
      ` · <b style="color:var(--broken)">${failed.length} en échec : ${esc(failed.join(", "))}</b>`:" · aucun échec"}<br>
    sources : brain_v2_traces · watch_ledger · thesis_verdicts · open_inquiries · battery · wake_scores ·
    fact_api · fundamentals_history · crypto_server :5002<br>
    Aucune valeur de repli : un bloc absent, périmé ou en échec s'affiche comme manquant.`;
  if(isRefresh)renderView(CUR,true);
  else{const h=location.hash.slice(1);renderView(TITLES[h]?h:"poste");}
}

/* ── ACTUALISATION ──────────────────────────────────────────────────
   Le flux est régénéré toutes les 2 h côté VPS. Une app ajoutée à l'écran
   d'accueil iOS n'est presque jamais rechargée : on la REPREND depuis
   l'arrière-plan. Sans ce bloc, elle affiche indéfiniment les données du
   premier chargement. On re-télécharge donc au retour au premier plan,
   périodiquement tant que l'app est visible, et à la demande.
   ─────────────────────────────────────────────────────────────────── */
let LAST_LOAD=0,LOADING=false;
const REFRESH_MS=5*60*1000;    // tant que l'écran est visible
const MIN_GAP_MS=60*1000;      // anti-rafale au retour au premier plan

async function load(isRefresh){
  if(LOADING)return;
  LOADING=true;
  const chip=$("refresh");
  if(chip&&isRefresh)chip.dataset.busy="1";
  try{
    const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    if(j.schema_version!==2)throw new Error("schema_version "+j.schema_version+" — le front attend la 2");
    LAST_LOAD=Date.now();
    boot(j,isRefresh);
  }catch(err){
    if(!DATA){
      $("views").innerHTML=`<div class="card"><div class="missing"><b>flux indisponible</b>
        ${esc(err.message)}
        <div class="note">Le terminal n'affiche aucune donnée de substitution : sans <code>data.json</code> valide, il n'y a rien à montrer.
        Vérifier <code>terminal_feed.py</code> et <code>dashboard_push.sh</code> sur delta.</div></div></div>`;
      $("pulse").className="pulse ko";$("pulse-t").textContent="flux indisponible";
    }else if(chip){
      // on garde l'affichage précédent, mais on ne prétend pas qu'il est frais
      chip.dataset.failed="1";
    }
    console.error(err);
  }finally{
    LOADING=false;
    const c=$("refresh");if(c)delete c.dataset.busy;
  }
}

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){HIDDEN_AT=Date.now();return;}
  // Retour au premier plan après une vraie absence : c'est une NOUVELLE consultation.
  // On recule le repère sur la précédente (celle qu'on avait enregistrée en partant),
  // puis on enregistre celle-ci. Un re-fetch automatique, lui, ne touche à rien.
  if(HIDDEN_AT&&Date.now()-HIDDEN_AT>SEEN_GAP){
    try{SEEN=+(localStorage.getItem(SEEN_KEY)||0)||SEEN;}catch(e){}
    touchSeen();
  }
  if(Date.now()-LAST_LOAD>MIN_GAP_MS)load(true);});
addEventListener("pageshow",e=>{
  if(e.persisted&&Date.now()-LAST_LOAD>MIN_GAP_MS)load(true);});
addEventListener("online",()=>{if(Date.now()-LAST_LOAD>MIN_GAP_MS)load(true);});
setInterval(()=>{if(!document.hidden&&navigator.onLine!==false)load(true);},REFRESH_MS);
document.addEventListener("click",e=>{
  if(e.target.closest("#refresh")){e.preventDefault();load(true);}});

/* nav */
$("nav").addEventListener("click",e=>{
  const a=e.target.closest("a[data-v]");if(!a)return;
  e.preventDefault();location.hash=a.dataset.v;renderView(a.dataset.v);});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(TITLES[h]&&h!==CUR)renderView(h);});
/* dépli des briefs (délégation) */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tx]");if(!b)return;
  const t=$(b.dataset.tx);if(!t)return;
  const open=t.classList.toggle("open");
  b.setAttribute("aria-expanded",String(open));
  b.textContent=open?"réduire ↑":"lire la suite ↓";});
/* ── bulle d'info : rend au tap ce que le desktop donne au survol ──── */
(function(){
  const tip=$("tip");let hideT=null;
  const LABEL={"wall b":"Veille","fchip":"Fraîcheur","srcpill":"Producteur","chip":"Détail",
    "tier":"Tier","bar":"Libellé"};
  function show(title,kind){
    clearTimeout(hideT);
    tip.innerHTML=`<b>${esc(kind||"Détail")}</b>${esc(title)}<button type="button" aria-label="Fermer">✕</button>`;
    tip.dataset.on="1";
    hideT=setTimeout(hide,7000);
  }
  function hide(){delete tip.dataset.on;}
  tip.addEventListener("click",e=>{if(e.target.closest("button"))hide();});
  document.addEventListener("click",e=>{
    if(e.target.closest("#tip"))return;
    const el=e.target.closest("[title]");
    if(!el){hide();return;}
    const t=el.getAttribute("title");
    if(!t){hide();return;}
    // on ne détourne pas un lien : le tap doit continuer à ouvrir l'article
    if(el.closest("a[href]")&&!el.classList.contains("wall"))return;
    let kind="Détail";
    if(el.matches(".wall b"))kind="Veille";
    else if(el.matches(".fchip"))kind="Fraîcheur du bloc";
    else if(el.matches(".srcpill"))kind="Producteur";
    else if(el.matches(".bar .n"))kind="Libellé complet";
    show(t,kind);
  },{passive:true});
  addEventListener("keydown",e=>{if(e.key==="Escape")hide();});
})();

/* recherche */
$("q").addEventListener("input",e=>applyFilter(e.target.value));
addEventListener("keydown",e=>{
  if(e.key==="/"&&document.activeElement!==$("q")){e.preventDefault();$("q").focus();}
  if(e.key==="Escape"&&document.activeElement===$("q")){$("q").value="";applyFilter("");$("q").blur();}});
/* thème */
(function(){
  const K="hermes-theme";
  const sys=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";
  const set=t=>{document.documentElement.dataset.theme=t;
    $("theme-t").textContent=t==="dark"?"Clair":"Sombre";
    try{localStorage.setItem(K,t);}catch(e){}};
  let cur;try{cur=localStorage.getItem(K);}catch(e){}
  set(cur||sys);
  $("theme").addEventListener("click",()=>set(document.documentElement.dataset.theme==="dark"?"light":"dark"));
})();

/* chargement initial */
load(false);
</script>

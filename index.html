<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0e0e10;color:#e7e5df;font-family:'JetBrains Mono',ui-monospace,'Courier New',monospace;
  background-image:radial-gradient(60% 50% at 50% 38%,rgba(110,124,85,.09),transparent 70%)}
.card{text-align:center;padding:40px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6E7C55;margin-right:11px;
  box-shadow:0 0 14px rgba(110,124,85,.7);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
h1{font-weight:400;font-size:22px;letter-spacing:.1em;margin:0 0 12px}
p{color:#8b887e;font-size:13px;letter-spacing:.04em;margin:4px 0}
.tag{margin-top:24px;font-size:11px;color:#5f5e58;letter-spacing:.22em;text-transform:uppercase}
</style>
</head>
<body>
<div class="card">
<h1><span class="dot"></span>terminal</h1>
<p>en reconstruction</p>
<p>contenu precedent retire — redesign a venir</p>
<div class="tag">nettoye · 2026-07-07</div>
</div>
</body>
</html>
